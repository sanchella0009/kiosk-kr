services:
  kiosk-web:
    build: .
    # ports:
    #   - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - kiosk-ws
      - kiosk-music
  kiosk-ws:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    # ports:
    #   - "3001:3001"
    command: >
      sh -c "npm ci &&
      npm run ws:server"
  kiosk-music:
    build:
      context: ./music-service
    working_dir: /app
    env_file:
      - .env
    # ports:
    #   - "3010:3010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  kiosk-bot:
    image: node:20
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "npm ci &&
      npx prisma generate &&
      npm run bot"
    depends_on:
      - kiosk-web

  nginx:
    image: nginx:alpine
    ports:
      - "3500:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kiosk-web
      - kiosk-ws
      - kiosk-music
